name: Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: nixbuild/nix-quick-install-action@v35

      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}

      - name: Build and test
        run: nix develop -c make test-auto

      - name: Test Python
        run: |
          nix develop -c python3 -m pytest python/tests -q
          nix develop -c python3 -m mypy

      - name: Test C#
        if: matrix.os == 'ubuntu-latest'
        run: nix develop -c dotnet test csharp/tests/Pppp.Tests.csproj -c Debug

  check-windows:
    name: Test Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: "3.1.1"

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: "8.0.x"

      - name: Configure
        run: xmake f -y -c -m debug

      - name: Build
        run: xmake -y

      - name: Test
        run: xmake test

      - name: Test C#
        run: dotnet test csharp/tests/Pppp.Tests.csproj -c Debug

  check-configurations:
    name: Test ${{ matrix.isa }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            isa: scalar
          - os: ubuntu-latest
            isa: avx2
          - os: macos-latest
            isa: neon
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: nixbuild/nix-quick-install-action@v35

      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}

      - name: Build and test
        run: nix develop -c make test-${{ matrix.isa }}

  generated:
    name: Generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: nixbuild/nix-quick-install-action@v35

      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}

      - name: Update mods
        run: nix develop -c make fetch-mods generate-mods

      - name: Check mods
        run: |
          git diff --exit-code -- \
            codegen/mods/mods.json \
            src/pppp/mods/generated_mods.h \
            src/pppp/mods/generated_mods.cpp

      - name: Update parity
        run: nix develop -c make generate-parity-tests

      - name: Check parity
        run: |
          git diff --exit-code -- \
            tests/parity/parity.json

  pre-commit:
    name: File checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: nixbuild/nix-quick-install-action@v35

      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}

      - name: Run checks
        run: nix develop -c pre-commit run --all-files --show-diff-on-failure
