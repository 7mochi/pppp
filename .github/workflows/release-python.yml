name: Release the python bindings

on:
  push:
    tags:
      - "py-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify the tag against the manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check the tag matches the version it releases
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#*-v}"
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          echo "tag=$tag version=$version declared=$declared"
          [ "$version" = "$declared" ] || { echo "The tag says $version but the manifest says $declared"; exit 1; }

  python-wheels:
    name: Python wheel / ${{ matrix.platform }}
    needs: verify-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-26
            platform: macos-arm64
          - runner: macos-26-intel
            platform: macos-x86_64
          - runner: windows-2025
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@v4.3.0
        env:
          CIBW_ARCHS: native
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pppp-wheel-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  python-installed:
    name: Python installed / ${{ matrix.platform }}
    needs: python-wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-26
            platform: macos-arm64
          - runner: macos-26-intel
            platform: macos-x86_64
          - runner: windows-2025
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: pppp-wheel-${{ matrix.platform }}
          path: wheelhouse
      - run: python -m pip install pytest
      - run: python -m pip install --no-index --find-links wheelhouse pppp-py
      - run: python -m pytest python/tests

  python-sdist:
    name: Python source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pppp-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 3

  publish-pypi:
    name: Publish to PyPI
    needs: [python-wheels, python-installed, python-sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pppp-py
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: pppp-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          skip-existing: true
