name: Bump the version

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: "Artifact"
        required: true
        default: "core"
        type: choice
        options:
          - core
          - python
          - node
          - csharp
      version:
        description: "Version"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    name: Bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set Git author
        run: |
          git config user.name "7mochi"
          git config user.email "flyingcatdm@gmail.com"

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: pip install --upgrade bump-my-version

      - name: Bump version
        run: bump-my-version bump --config-file .bumpversion/${{ github.event.inputs.artifact }}.toml --allow-dirty ${{ github.event.inputs.version }}

      - name: Push changes
        uses: ad-m/github-push-action@v1.3.0
        with:
          github_token: ${{ secrets.PAT }}
          tags: true
