name: Release C#

on:
  push:
    tags:
      - "cs-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-tag:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check version
        run: |
          set -eu
          version="${GITHUB_REF_NAME#cs-v}"
          declared="$(
            sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' csharp/Pppp.csproj \
              | head -1
          )"
          echo "tag=${GITHUB_REF_NAME} version=${version} declared=${declared}"

          if [ "$version" != "$declared" ]; then
            echo "error: tag $version doesn't match Pppp.csproj ($declared)"
            exit 1
          fi

  native:
    name: Build ${{ matrix.rid }}
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
            args: -a x86_64
          - os: windows-2022
            rid: win-x86
            args: -a x86
          - os: windows-11-arm
            rid: win-arm64
            args: -a arm64
          - os: ubuntu-latest
            rid: linux-x64
            args: ""
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            args: ""
          - os: macos-latest
            rid: osx-arm64
            args: ""
          - os: macos-26-intel
            rid: osx-x64
            args: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: "3.1.1"

      - name: Build
        run: |
          xmake f -y -c -m release --pppp_build_tests=n ${{ matrix.args }}
          xmake -y

      - name: Copy files
        run: |
          mkdir -p "csharp/native/${{ matrix.rid }}"
          find build -type f \( -name '*pppp_c.so' -o -name '*pppp_c.dylib' \
            -o -name 'pppp_c.dll' -o -name '*fosu_engine_*' \) \
            -exec cp {} "csharp/native/${{ matrix.rid }}/" \;

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pppp-native-${{ matrix.rid }}
          path: csharp/native
          if-no-files-found: error
          retention-days: 1

  pack:
    name: Pack
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: "8.0.x"

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: pppp-native-*
          path: csharp/native
          merge-multiple: true

      - name: Pack
        run: dotnet pack csharp/Pppp.csproj -c Release -o artifacts

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pppp-nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish
    needs: [pack]
    runs-on: ubuntu-latest
    environment:
      name: nuget
      url: https://www.nuget.org/packages/pppp-dotnet
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: pppp-nupkg
          path: artifacts

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: "8.0.x"

      - name: Log in
        uses: NuGet/login@v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${RELEASE_TAG#cs-v}"
          previous="$(
            git tag --list 'cs-v*' --sort=-version:refname \
              | grep -v "^${RELEASE_TAG}$" \
              | head -1 || true
          )"

          if ! gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            args=(
              --draft
              --verify-tag
              --generate-notes
              --latest=false
              --title "C# v${version}"
              --repo "$GITHUB_REPOSITORY"
            )

            if [ -n "$previous" ]; then
              args+=(--notes-start-tag "$previous")
            fi

            gh release create "$RELEASE_TAG" "${args[@]}"
          fi

          gh release upload "$RELEASE_TAG" artifacts/*.nupkg \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --latest=false \
            --repo "$GITHUB_REPOSITORY"
