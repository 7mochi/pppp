[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pppp-py"
version = "0.0.0"
description = "osu! difficulty and performance calculation for all four gamemodes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["python/pppp"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "tools/hatch_build.py"

[tool.mypy]
python_version = "3.10"
files = ["python/pppp"]
mypy_path = "python"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pppp._ctypes._native", "pppp._ctypes.ctypes_preamble", "pppp._ctypes.ctypes_loader"]
ignore_errors = true

[tool.pyright]
include = ["python"]
exclude = ["python/pppp/_ctypes", "python/tests"]
extraPaths = ["python"]
pythonVersion = "3.10"

# ctypesgen emits runtime ctypes wrappers without type annotations. The generated
# _ctypes layer is intentionally untyped; the hand-written API above it is checked.
reportAny = false
reportExplicitAny = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false

[tool.pytest.ini_options]
pythonpath = ["python"]
