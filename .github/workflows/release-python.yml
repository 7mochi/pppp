name: Release the Python bindings

on:
  push:
    branches:
      - master
    paths:
      - ".bumpversion.toml"
    tags-ignore:
      - "**"

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    if: "startsWith(github.event.head_commit.message, 'chore: bump version')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-26
            platform: macos-arm64
          - runner: macos-26-intel
            platform: macos-x86_64
          - runner: windows-2025
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ARCHS: native
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pppp-wheel-${{ matrix.platform }}
          path: wheelhouse/*.whl

  installed:
    name: Installed / ${{ matrix.platform }}
    needs: wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-26
            platform: macos-arm64
          - runner: macos-26-intel
            platform: macos-x86_64
          - runner: windows-2025
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: pppp-wheel-${{ matrix.platform }}
          path: wheelhouse
      - run: python -m pip install pytest
      - run: python -m pip install --no-index --find-links wheelhouse pppp-py
      - run: python -m pytest python/tests

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    if: "startsWith(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pppp-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [wheels, installed, sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pppp-py
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: pppp-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1.14.2
