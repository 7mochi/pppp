name: Release core

on:
  push:
    tags:
      - "core-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-tag:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check version
        run: |
          set -eu
          version="${GITHUB_REF_NAME#core-v}"

          xmake_version="$(
            sed -n 's/^set_version("\([^"]*\)").*/\1/p' xmake.lua \
              | head -1
          )"

          macro_version() {
            sed -n "s/^#define $1 \([0-9][0-9]*\)$/\1/p" include/pppp/version.h \
              | head -1
          }

          major="$(macro_version PPPP_VERSION_MAJOR)"
          minor="$(macro_version PPPP_VERSION_MINOR)"
          patch="$(macro_version PPPP_VERSION_PATCH)"
          header_version="${major}.${minor}.${patch}"
          echo "tag=${version} xmake=${xmake_version} header=${header_version}"

          if [ "$version" != "$xmake_version" ]; then
            echo "error: tag $version doesn't match xmake.lua ($xmake_version)"
            exit 1
          fi

          if [ "$version" != "$header_version" ]; then
            echo "error: tag $version doesn't match version.h ($header_version)"
            exit 1
          fi

  release:
    name: Publish
    needs: verify-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${RELEASE_TAG#core-v}"
          previous="$(
            git tag --list 'core-v*' --sort=-version:refname \
              | grep -v "^${RELEASE_TAG}$" \
              | head -1 || true
          )"

          if ! gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            args=(
              --verify-tag
              --generate-notes
              --latest
              --title "Core v${version}"
              --repo "$GITHUB_REPOSITORY"
            )

            if [ -n "$previous" ]; then
              args+=(--notes-start-tag "$previous")
            fi

            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
