name: Check pppp

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            core:
              - 'src/**'
              - 'include/**'
              - 'third_party/**'
              - 'tests/**'
              - 'codegen/**'
              - 'reference/**'
              - 'cmake/ppppPlaceEngine.cmake'
              - 'xmake.lua'
              - 'xmake/**'
              - 'Makefile'
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'

  all-succeeded:
    name: All Succeeded
    if: always()
    runs-on: ubuntu-latest
    needs: [changes, check, check-windows, check-configurations, mods-freshness, parity-freshness, pre-commit]
    steps:
      - uses: re-actors/alls-green@v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: check,check-windows,check-configurations,mods-freshness,parity-freshness

  check:
    name: Check on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
      - name: Format
        run: nix develop -c make check-format
      - name: Tidy
        continue-on-error: true
        run: nix develop -c make check-tidy
      - name: Build and test
        run: nix develop -c make test-auto

  check-windows:
    name: Check on windows-latest
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: '3.1.1'
      - name: Configure
        run: xmake f -y -m release
      - name: Build
        run: xmake -y
      - name: Test
        run: xmake test

  check-configurations:
    name: Check ${{ matrix.isa }} on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            isa: scalar
          - os: ubuntu-latest
            isa: avx2
          - os: macos-latest
            isa: neon
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
      - name: Build and test (${{ matrix.isa }})
        run: nix develop -c make test-${{ matrix.isa }}

  mods-freshness:
    name: Check the generated mod table is current
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
      - name: Refresh the data and regenerate the mod table
        run: nix develop -c make fetch-mods generate-mods
      - name: Fail if the committed data or table moved
        run: git diff --exit-code -- codegen/mods/mods.json src/pppp/mods/generated_mods.h src/pppp/mods/generated_mods.cpp

  parity-freshness:
    name: Check the parity fixture is current
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
      - name: Regenerate the parity fixture
        run: nix develop -c make generate-parity-tests
      - name: Fail if the committed fixture moved
        run: git diff --exit-code -- tests/parity/parity.json

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
      - name: Run the hooks
        run: nix develop -c pre-commit run --all-files --show-diff-on-failure
