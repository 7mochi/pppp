name: Release the node bindings

on:
  push:
    branches:
      - master
    paths:
      - ".bumpversion.toml"
    tags-ignore:
      - "**"

permissions:
  contents: read

env:
  BINDING_NAME: pppp_node
  NAPI_VERSION: 8

jobs:
  build:
    name: Prebuild / ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    if: "startsWith(github.event.head_commit.message, 'chore: bump version')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
          - os: windows-11-arm
            arch: arm64
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
      - run: npm install
      - run: npm test
      - run: npx pkg-prebuilds-copy --baseDir build/Release --source ${{ env.BINDING_NAME }}.node --name=${{ env.BINDING_NAME }} --strip --napi_version=${{ env.NAPI_VERSION }} --arch=${{ matrix.arch }}
        working-directory: node
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: prebuilds-${{ matrix.os }}-${{ matrix.arch }}
          path: node/prebuilds

  bundle:
    name: Bundle the prebuilds
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: tmp
      - run: |
          mkdir -p node/prebuilds
          mv tmp/*/* node/prebuilds/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: all-prebuilds
          path: node/prebuilds

  publish:
    name: Publish to npm
    needs: bundle
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@7mochi/pppp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: all-prebuilds
          path: node/prebuilds
      - run: npm ci
      - run: npm publish
