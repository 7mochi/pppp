name: Release the node bindings

on:
  push:
    tags:
      - "node-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BINDING_NAME: pppp_node
  NAPI_VERSION: 8

jobs:
  verify-tag:
    name: Verify the tag against the manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check the tag matches the version it releases
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#*-v}"
          declared="$(sed -n 's/.*"version": "\(.*\)".*/\1/p' package.json | head -1)"
          echo "tag=$tag version=$version declared=$declared"
          [ "$version" = "$declared" ] || { echo "The tag says $version but the manifest says $declared"; exit 1; }

  node-build:
    name: Node prebuild / ${{ matrix.os }} / ${{ matrix.arch }}
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
          - os: windows-11-arm
            arch: arm64
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
      - run: npm install
      - run: npm test
      - run: npx pkg-prebuilds-copy --baseDir build/Release --source ${{ env.BINDING_NAME }}.node --name=${{ env.BINDING_NAME }} --strip --napi_version=${{ env.NAPI_VERSION }} --arch=${{ matrix.arch }}
        working-directory: node
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: prebuilds-${{ matrix.os }}-${{ matrix.arch }}
          path: node/prebuilds
          if-no-files-found: error
          retention-days: 1

  node-bundle:
    name: Bundle the prebuilds
    needs: node-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: tmp
      - run: |
          mkdir -p node/prebuilds
          mv tmp/*/* node/prebuilds/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: all-prebuilds
          path: node/prebuilds
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    name: Publish to npm
    needs: node-bundle
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@7mochi/pppp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: all-prebuilds
          path: node/prebuilds
      - run: npm ci
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@7mochi/pppp@$version" version >/dev/null 2>&1; then
            echo "npm already has $version; nothing to publish"
          else
            npm publish
          fi
