name: Release Python

on:
  push:
    tags:
      - "py-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-tag:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check version
        run: |
          set -eu
          version="${GITHUB_REF_NAME#py-v}"
          declared="$(
            sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml \
              | head -1
          )"
          echo "tag=${GITHUB_REF_NAME} version=${version} declared=${declared}"

          if [ "$version" != "$declared" ]; then
            echo "error: tag $version doesn't match pyproject.toml ($declared)"
            exit 1
          fi

  wheels:
    name: Build ${{ matrix.platform }}
    needs: verify-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-26
            platform: macos-arm64
          - runner: macos-26-intel
            platform: macos-x86_64
          - runner: windows-2025
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: "3.1.1"

      - name: Build
        run: |
          xmake f -y -c -m release --pppp_build_tests=n
          xmake -y

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pppp-wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  sdist:
    name: Build source
    needs: verify-tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - run: python -m pip install build

      - run: python -m build --sdist

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pppp-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pppp-py
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: pppp-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          skip-existing: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${RELEASE_TAG#py-v}"
          previous="$(
            git tag --list 'py-v*' --sort=-version:refname \
              | grep -v "^${RELEASE_TAG}$" \
              | head -1 || true
          )"

          if ! gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            args=(
              --draft
              --verify-tag
              --generate-notes
              --latest=false
              --title "Python v${version}"
              --repo "$GITHUB_REPOSITORY"
            )

            if [ -n "$previous" ]; then
              args+=(--notes-start-tag "$previous")
            fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi

          gh release upload "$RELEASE_TAG" dist/* \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --latest=false \
            --repo "$GITHUB_REPOSITORY"
