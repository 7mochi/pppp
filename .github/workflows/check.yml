name: Check pppp

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  all-succeeded:
    name: All Succeeded
    if: always()
    runs-on: ubuntu-latest
    needs: [check, check-windows]
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  check:
    name: Check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
      - name: Format
        run: nix develop -c make format-check
      - name: Build and test
        run: nix develop -c make test
      - name: Test the bindings
        run: |
          nix develop -c python3 -m venv --system-site-packages "$RUNNER_TEMP/venv"
          nix develop -c "$RUNNER_TEMP/venv/bin/python" -m pip install --no-build-isolation --no-deps .
          nix develop -c "$RUNNER_TEMP/venv/bin/python" -m pytest python/tests
      - name: Check the types
        run: nix develop -c mypy

  check-windows:
    name: Check on windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Configure
        run: cmake -S . -B build -DPPPP_BUILD_TESTS=ON -DPPPP_BUILD_PYTHON=ON
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Test the bindings
        run: |
          python -m pip install . "pytest>=8"
          python -m pytest python/tests
