[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "pppp-py"
version = "0.0.1"
description = "osu! difficulty and performance calculation for all four gamemodes in C++98"
readme = "README.md"
license = "MIT"
license-files = ["LICENCE"]
requires-python = ">=3.10"
dependencies = ["typing-extensions>=4.6; python_version < '3.11'"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: C++",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
]

[tool.scikit-build]
cmake.version = ">=3.26"
ninja.make-fallback = true
wheel.packages = ["python/pppp"]
wheel.py-api = "cp310"

[tool.cibuildwheel]
build = "cp310-*"
test-requires = ["pytest>=8"]
test-command = "python -m pytest {project}/python/tests"

[tool.mypy]
python_version = "3.10"
files = ["python/pppp", "python/tests/typing"]
strict = true
warn_unreachable = true
enable_error_code = [
  "truthy-bool",
  "truthy-iterable",
  "ignore-without-code",
  "redundant-expr",
  "possibly-undefined",
  "mutable-override",
]
