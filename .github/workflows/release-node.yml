name: Release the node bindings

on:
  push:
    tags:
      - "node-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify the tag against the manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check the tag matches the version it releases
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#*-v}"
          declared="$(sed -n 's/.*"version": "\(.*\)".*/\1/p' package.json | head -1)"
          echo "tag=$tag version=$version declared=$declared"
          [ "$version" = "$declared" ] || { echo "The tag says $version but the manifest says $declared"; exit 1; }

  # The bindings reach `pppp_c` through Koffi, so there is no addon to compile: the only native
  # artifact is the C library, built once per platform and staged beside `index.js`.
  library-build:
    name: pppp_c / ${{ matrix.os }} / ${{ matrix.arch }}
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
          - os: windows-11-arm
            arch: arm64
          - os: macos-latest
            arch: arm64
          - os: macos-26-intel
            arch: x64
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
      - name: Configure the library
        run: cmake --preset release -DPPPP_PGO=GENERATE -DPPPP_PGO_DIR="${{ github.workspace }}/profdata"
      - name: Build the instrumented library
        run: cmake --build --preset release
      - name: Install the dependencies
        run: npm install --ignore-scripts
      - name: Generate the PGO data
        run: npm test
        env:
          PPPP_LIBRARY: ${{ github.workspace }}/build/release/pppp_c.${{ runner.os == 'Windows' && 'dll' || runner.os == 'macOS' && 'dylib' || 'so' }}
      - name: Merge the PGO data
        if: runner.os == 'macOS'
        run: xcrun llvm-profdata merge -output="${{ github.workspace }}/profdata/default.profdata" "${{ github.workspace }}"/profdata/*.profraw
      - name: Build the PGO-optimized library
        run: |
          cmake --preset release -DPPPP_PGO=USE -DPPPP_PGO_DIR="${{ github.workspace }}/profdata"
          cmake --build --preset release
      - name: Stage the library beside the bindings
        run: node node/scripts/stage-library.mjs "build/release/pppp_c.${{ runner.os == 'Windows' && 'dll' || runner.os == 'macOS' && 'dylib' || 'so' }}"
      - run: npm test
        env:
          FOSU_BACKEND: scalar
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: library-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            node/pppp_c.so
            node/pppp_c.dll
            node/pppp_c.dylib
            node/libfosu_engine_*.so
            node/fosu_engine_*.dll
            node/libfosu_engine_*.dylib
          if-no-files-found: error
          retention-days: 1

  library-bundle:
    name: Bundle the libraries
    needs: library-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: tmp
      - run: |
          mkdir -p node/native
          mv tmp/*/* node/native/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: all-libraries
          path: node/native
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    name: Publish to npm
    needs: library-bundle
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@7mochi/pppp
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: all-libraries
          path: node/native
      - run: npm ci
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@7mochi/pppp@$version" version >/dev/null 2>&1; then
            echo "npm already has $version; nothing to publish"
          else
            npm publish
          fi
      - name: Pack the published tarball
        run: mkdir -p dist && npm pack --pack-destination dist
      - name: Create the draft release and upload the tarball
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --generate-notes \
              --title "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$RELEASE_TAG" dist/*.tgz --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
