repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: &exclude |
          (?x)^(
            third_party/(atomic-lite|optional-bare|span-lite|string-view-lite|variant-lite)/|
            LICENCE$|
            .*\.osu$|
            .*\.patch$
          )
      - id: end-of-file-fixer
        exclude: &generated |
          (?x)^(
            third_party/(atomic-lite|optional-bare|span-lite|string-view-lite|variant-lite)/|
            LICENCE$|
            .*\.osu$|
            .*\.patch$
          )
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: .pre-commit/run.sh clang-format -i
        language: system
        files: |
          (?x)^(
            (include|src|tests)/.*\.h$|
            (src|tests)/.*\.cpp$|
            third_party/fosu/(src|tests)/.*\.(h|cpp|cc)$
          )
      - id: nixfmt
        name: nixfmt
        entry: .pre-commit/run.sh nixfmt
        language: system
        types: [nix]
