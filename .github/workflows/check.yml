name: Check pppp

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      core: ${{ steps.filter.outputs.core }}
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
      csharp: ${{ steps.filter.outputs.csharp }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**.md'
            core:
              - 'src/**'
              - 'include/**'
              - 'third_party/**'
              - 'tests/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'cmake/**'
              - 'capi.map'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/**'
            python:
              - 'python/**'
              - 'pyproject.toml'
              - 'src/pppp/bindings/python.cpp'
            node:
              - 'package.json'
              - 'package-lock.json'
              - 'node/**'
              - 'src/pppp/bindings/node.cpp'
            csharp:
              - 'csharp/**'

  all-succeeded:
    name: All Succeeded
    if: always()
    runs-on: ubuntu-latest
    needs: [changes, check, check-windows]
    steps:
      - uses: re-actors/alls-green@v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: check,check-windows

  check:
    name: Check on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
      - name: Format
        run: nix develop -c make check-format
      - name: Build and test
        run: nix develop -c make test
      - name: Test the bindings
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.python == 'true'
        run: |
          nix develop -c python3 -m venv --system-site-packages "$RUNNER_TEMP/venv"
          nix develop -c "$RUNNER_TEMP/venv/bin/python" -m pip install --no-build-isolation --no-deps .
          nix develop -c "$RUNNER_TEMP/venv/bin/python" -m pytest python/tests
      - name: Check the types
        run: nix develop -c mypy
      - name: Test the Node bindings
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.node == 'true'
        run: |
          nix develop -c npm install
          nix develop -c npm test
      - name: Test the C# bindings
        if: matrix.os == 'ubuntu-latest' && (needs.changes.outputs.core == 'true' || needs.changes.outputs.csharp == 'true')
        run: |
          nix develop -c bash -c "cd csharp/tests && dotnet build && LD_LIBRARY_PATH=$GITHUB_WORKSPACE/build dotnet run -f net8.0 --no-build"

  check-windows:
    name: Check on windows-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - name: Configure
        run: cmake -S . -B build -DPPPP_BUILD_TESTS=ON -DPPPP_BUILD_PYTHON=ON -DPPPP_BUILD_CAPI=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test the python bindings
        run: |
          python -m pip install . "pytest>=8"
          python -m pytest python/tests
      - name: Check the types
        run: |
          python -m pip install mypy
          python -m mypy
      - name: Test the node bindings
        run: |
          npm install
          npm test
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
      - name: Test the C# bindings
        run: |
          $env:PATH = "$pwd\build\Release;$env:PATH"
          cd csharp/tests
          dotnet build
          dotnet run -f net20 --no-build
