name: Release the bindings

on:
  push:
    branches:
      - master
    paths:
      - ".bumpversion.toml"
    tags-ignore:
      - "**"

permissions:
  contents: read

env:
  BINDING_NAME: pppp_node
  NAPI_VERSION: 8

jobs:
  node-build:
    name: Node prebuild / ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    if: "startsWith(github.event.head_commit.message, 'chore: bump version')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
          - os: windows-11-arm
            arch: arm64
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
      - run: npm install
      - run: npm test
      - run: npx pkg-prebuilds-copy --baseDir build/Release --source ${{ env.BINDING_NAME }}.node --name=${{ env.BINDING_NAME }} --strip --napi_version=${{ env.NAPI_VERSION }} --arch=${{ matrix.arch }}
        working-directory: node
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: prebuilds-${{ matrix.os }}-${{ matrix.arch }}
          path: node/prebuilds

  node-bundle:
    name: Bundle the prebuilds
    needs: node-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: tmp
      - run: |
          mkdir -p node/prebuilds
          mv tmp/*/* node/prebuilds/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: all-prebuilds
          path: node/prebuilds

  dotnet-native:
    name: C# native / ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    if: "startsWith(github.event.head_commit.message, 'chore: bump version')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
            args: -A x64
          - os: windows-2022
            rid: win-x86
            args: -A Win32
          - os: windows-11-arm
            rid: win-arm64
            args: -A ARM64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
            args: -DCMAKE_OSX_ARCHITECTURES=x86_64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: nixbuild/nix-quick-install-action@v35
        if: runner.os != 'Windows'
      - name: Configure and build
        if: runner.os != 'Windows'
        shell: bash
        run: |
          nix develop -c bash -c "cmake -S . -B build -DPPPP_BUILD_CAPI=ON -DCMAKE_BUILD_TYPE=Release ${{ matrix.args }}"
          nix develop -c cmake --build build
      - name: Configure and build
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -DPPPP_BUILD_CAPI=ON ${{ matrix.args }}
          cmake --build build --config Release
      - name: Collect the native
        if: runner.os != 'Windows'
        shell: bash
        run: |
          extension="so"
          if [ "${{ runner.os }}" = "macOS" ]; then extension="dylib"; fi
          mkdir -p "csharp/native/${{ matrix.rid }}"
          cp "build/pppp_c.$extension" "csharp/native/${{ matrix.rid }}/pppp_c.$extension"
      - name: Collect the native
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "csharp/native/${{ matrix.rid }}"
          cp "build/Release/pppp_c.dll" "csharp/native/${{ matrix.rid }}/pppp_c.dll"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pppp-native-${{ matrix.rid }}
          path: csharp/native/
          if-no-files-found: error

  dotnet-pack:
    name: Pack the C# package
    needs: dotnet-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: pppp-native-*
          path: csharp/native
          merge-multiple: true
      - name: Pack
        run: dotnet pack csharp/Pppp.csproj -c Release -o artifacts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pppp-nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

  dotnet-installed:
    name: C# installed / ${{ matrix.os }}
    needs: dotnet-pack
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-2022
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: pppp-nupkg
          path: artifacts
      - name: Install the package and run the suite
        shell: bash
        run: |
          mkdir -p consumer && cd consumer
          dotnet new console --force
          dotnet nuget add source "$GITHUB_WORKSPACE/artifacts" --name pppp
          dotnet add package pppp-dotnet
          cp ../csharp/tests/Program.cs Program.cs
          dotnet run
      - name: Install the package and run the suite on net20
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p consumer20 && cd consumer20
          cat > consumer20.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net20</TargetFramework>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.NETFramework.ReferenceAssemblies.net20" Version="1.0.3" PrivateAssets="All" />
            </ItemGroup>
          </Project>
          EOF
          dotnet nuget add source "$GITHUB_WORKSPACE/artifacts" --name pppp
          dotnet add package pppp-dotnet
          cp ../csharp/tests/Program.cs Program.cs
          dotnet run

  python-wheels:
    name: Python wheel / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    if: "startsWith(github.event.head_commit.message, 'chore: bump version')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-26
            platform: macos-arm64
          - runner: macos-26-intel
            platform: macos-x86_64
          - runner: windows-2025
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ARCHS: native
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pppp-wheel-${{ matrix.platform }}
          path: wheelhouse/*.whl

  python-installed:
    name: Python installed / ${{ matrix.platform }}
    needs: python-wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-26
            platform: macos-arm64
          - runner: macos-26-intel
            platform: macos-x86_64
          - runner: windows-2025
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: pppp-wheel-${{ matrix.platform }}
          path: wheelhouse
      - run: python -m pip install pytest
      - run: python -m pip install --no-index --find-links wheelhouse pppp-py
      - run: python -m pytest python/tests

  python-sdist:
    name: Python source distribution
    runs-on: ubuntu-24.04
    if: "startsWith(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pppp-sdist
          path: dist/*.tar.gz

  publish-npm:
    name: Publish to npm
    needs: [node-bundle, dotnet-installed, python-installed, python-sdist]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@7mochi/pppp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: all-prebuilds
          path: node/prebuilds
      - run: npm ci
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@7mochi/pppp@$version" version >/dev/null 2>&1; then
            echo "npm already has $version; nothing to publish"
          else
            npm publish
          fi

  publish-nuget:
    name: Publish to NuGet
    needs: publish-npm
    runs-on: ubuntu-latest
    environment:
      name: nuget
      url: https://www.nuget.org/packages/pppp-dotnet
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: pppp-nupkg
          path: artifacts
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: NuGet login (OIDC to a temporary API key)
        uses: NuGet/login@v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-pypi:
    name: Publish to PyPI
    needs: publish-nuget
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pppp-py
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: pppp-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1.14.2
        with:
          skip-existing: true
