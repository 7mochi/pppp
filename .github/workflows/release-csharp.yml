name: Release the csharp bindings

on:
  push:
    tags:
      - "cs-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify the tag against the manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check the tag matches the version it releases
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#*-v}"
          declared="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' csharp/Pppp.csproj | head -1)"
          echo "tag=$tag version=$version declared=$declared"
          [ "$version" = "$declared" ] || { echo "The tag says $version but the manifest says $declared"; exit 1; }

  dotnet-native:
    name: C# native / ${{ matrix.rid }}
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
            args: -A x64
          - os: windows-2022
            rid: win-x86
            args: -A Win32
          - os: windows-11-arm
            rid: win-arm64
            args: -A ARM64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
            args: -DCMAKE_OSX_ARCHITECTURES=x86_64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: nixbuild/nix-quick-install-action@v35
        if: runner.os != 'Windows'
      - name: Configure and build
        if: runner.os != 'Windows'
        shell: bash
        run: |
          nix develop -c bash -c "cmake -S . -B build -DPPPP_BUILD_CAPI=ON -DCMAKE_BUILD_TYPE=Release ${{ matrix.args }}"
          nix develop -c cmake --build build
      - name: Configure and build
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -DPPPP_BUILD_CAPI=ON ${{ matrix.args }}
          cmake --build build --config Release
      - name: Collect the native
        if: runner.os != 'Windows'
        shell: bash
        run: |
          extension="so"
          if [ "${{ runner.os }}" = "macOS" ]; then extension="dylib"; fi
          mkdir -p "csharp/native/${{ matrix.rid }}"
          cp "build/pppp_c.$extension" "csharp/native/${{ matrix.rid }}/pppp_c.$extension"
      - name: Collect the native
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "csharp/native/${{ matrix.rid }}"
          cp "build/Release/pppp_c.dll" "csharp/native/${{ matrix.rid }}/pppp_c.dll"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pppp-native-${{ matrix.rid }}
          path: csharp/native/
          if-no-files-found: error
          retention-days: 1

  dotnet-pack:
    name: Pack the C# package
    needs: dotnet-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: pppp-native-*
          path: csharp/native
          merge-multiple: true
      - name: Pack
        run: dotnet pack csharp/Pppp.csproj -c Release -o artifacts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pppp-nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 3

  dotnet-installed:
    name: C# installed / ${{ matrix.os }}
    needs: dotnet-pack
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-2022
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: pppp-nupkg
          path: artifacts
      - name: Install the package and run the suite
        shell: bash
        run: |
          mkdir -p consumer && cd consumer
          dotnet new console --force
          dotnet nuget add source "$GITHUB_WORKSPACE/artifacts" --name pppp
          dotnet add package pppp-dotnet
          cp ../csharp/tests/Program.cs Program.cs
          dotnet run
      - name: Install the package and run the suite on net20
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p consumer20 && cd consumer20
          cat > consumer20.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net20</TargetFramework>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.NETFramework.ReferenceAssemblies.net20" Version="1.0.3" PrivateAssets="All" />
            </ItemGroup>
          </Project>
          EOF
          dotnet nuget add source "$GITHUB_WORKSPACE/artifacts" --name pppp
          dotnet add package pppp-dotnet
          cp ../csharp/tests/Program.cs Program.cs
          dotnet run

  publish-nuget:
    name: Publish to NuGet
    needs: [dotnet-pack, dotnet-installed]
    runs-on: ubuntu-latest
    environment:
      name: nuget
      url: https://www.nuget.org/packages/pppp-dotnet
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: pppp-nupkg
          path: artifacts
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: NuGet login (OIDC to a temporary API key)
        uses: NuGet/login@v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
